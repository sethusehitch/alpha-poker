name: alpha-poker

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        CADDYFILE: Caddyfile.aws
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      ALPHA_POKER_PRIMARY_HOSTNAME: "${ALPHA_POKER_PRIMARY_HOSTNAME:?set ALPHA_POKER_PRIMARY_HOSTNAME}"
      ALPHA_POKER_WWW_HOSTNAME: "${ALPHA_POKER_WWW_HOSTNAME:?set ALPHA_POKER_WWW_HOSTNAME}"
      ALPHA_POKER_TEMPORARY_HOSTNAME: "${ALPHA_POKER_TEMPORARY_HOSTNAME:?set ALPHA_POKER_TEMPORARY_HOSTNAME}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ops/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    mem_limit: 128m
    cpus: 0.25
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: /v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      ALPHA_POKER_API_URL: http://api:8000/v1
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    mem_limit: 768m
    cpus: 0.75
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      ALPHA_POKER_ENV: aws-lightsail
      ALPHA_POKER_DATA_DIR: /data
      ALPHA_POKER_AUTO_RUN: "${ALPHA_POKER_AUTO_RUN:-true}"
      ALPHA_POKER_AUTO_RUN_TIMEOUT_SECONDS: "${ALPHA_POKER_AUTO_RUN_TIMEOUT_SECONDS:-900}"
      ALPHA_POKER_AUTH_REQUIRED: "true"
      ALPHA_POKER_GOOGLE_CLIENT_ID: "${ALPHA_POKER_GOOGLE_CLIENT_ID:-}"
      ALPHA_POKER_GOOGLE_CLIENT_SECRET: "${ALPHA_POKER_GOOGLE_CLIENT_SECRET:-}"
      ALPHA_POKER_GOOGLE_REDIRECT_URI: "${ALPHA_POKER_GOOGLE_REDIRECT_URI:-https://alphapoker.io/browser-api/auth/google/callback}"
      ALPHA_POKER_PUBLIC_WEB_URL: "${ALPHA_POKER_PUBLIC_WEB_URL:-https://alphapoker.io}"
      ALPHA_POKER_RETAINED_HAND_RUNS: "${ALPHA_POKER_RETAINED_HAND_RUNS:-3}"
      ALPHA_POKER_RETAINED_ARTIFACT_RUNS: "${ALPHA_POKER_RETAINED_ARTIFACT_RUNS:-30}"
      ALPHA_POKER_INVITE_CODE: "${ALPHA_POKER_INVITE_CODE:?set ALPHA_POKER_INVITE_CODE}"
      ALPHA_POKER_OPERATOR_TOKEN: "${ALPHA_POKER_OPERATOR_TOKEN:?set ALPHA_POKER_OPERATOR_TOKEN}"
      ALPHA_POKER_OPERATOR_USERNAMES: "${ALPHA_POKER_OPERATOR_USERNAMES:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      ALPHA_POKER_FEEDBACK_RETENTION_DAYS: "${ALPHA_POKER_FEEDBACK_RETENTION_DAYS:-90}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    expose:
      - "8000"
    volumes:
      - alpha_poker_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)\""]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 30s
    init: true
    mem_limit: 2g
    cpus: 2.0
    networks:
      - internal

volumes:
  alpha_poker_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
