[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-poker-cli"
version = "0.1.0"
description = "Local tools for building and training Alpha Poker bots"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alpha-poker = "alpha_poker_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alpha_poker_cli*"]
